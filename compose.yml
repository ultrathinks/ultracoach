services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ultracoach
      POSTGRES_PASSWORD: ultracoach
      POSTGRES_DB: ultracoach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultracoach"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://ultracoach:ultracoach@postgres:5432/ultracoach
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      SUBSCRIPTION_PRO_AMOUNT: ${SUBSCRIPTION_PRO_AMOUNT:-19900}
      SUBSCRIPTION_PREMIUM_AMOUNT: ${SUBSCRIPTION_PREMIUM_AMOUNT:-39900}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - worker

volumes:
  pgdata:
